name: CI

on:
  push:
  pull_request:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    env:
      GITHUB_WEBHOOK_SECRET: test_secret
      GITHUB_TOKEN: test_token
      DATABASE_URL: postgresql://pr_user:pr_pass@localhost:5432/pr_review
      DASHBOARD_API_KEY: test-dashboard-key
      OPENAI_API_KEY: sk-test-not-used

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and API tests
        run: pytest -q

      - name: Run PR review benchmarks
        run: python benchmarks/pr_review_benchmark.py

      - name: Validate 120-PR evaluation corpus and prompt/model contract
        run: >-
          python benchmarks/evaluate.py
          --validate-only
          --contract benchmarks/baselines/evaluation_contract.v1.json

  docker-recovery:
    runs-on: ubuntu-latest
    env:
      GITHUB_WEBHOOK_SECRET: integration-secret
      GITHUB_TOKEN: integration-token
      OPENAI_API_KEY: sk-integration-not-used
      DASHBOARD_API_KEY: integration-dashboard-key
      TEST_DATABASE_URL: postgresql://pr_user:pr_pass@127.0.0.1:5432/pr_review

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies for recovery integration
        run: pip install -r requirements.txt

      - name: Build and start real PostgreSQL and isolated sandbox
        run: docker compose up --build -d db sandbox

      - name: Verify restart recovery and expired-lease reclaim
        run: python scripts/test_postgres_restart_recovery.py

      - name: Verify sandbox execution and network isolation
        run: docker compose run --rm worker python scripts/test_sandbox_roundtrip.py

      - name: Capture service diagnostics
        if: failure()
        run: docker compose logs --no-color db sandbox

      - name: Remove integration services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
