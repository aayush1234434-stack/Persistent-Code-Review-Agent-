<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Persistent Code Review Agent V2 architecture</title>
  <desc id="desc">GitHub events enter a durable queue, run in isolated analysis, pass through evidence-grounded review, pause for human approval, and feed evaluation telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker>
    <style>
      .title{font:700 34px Inter,system-ui,sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,system-ui,sans-serif;fill:#94a3b8}
      .lane{fill:#0b1728;stroke:#233c58;stroke-width:1.5}.box{fill:#10243a;stroke:#31506d;stroke-width:1.5;filter:url(#shadow)}
      .box2{fill:#102b38;stroke:#2dd4bf;stroke-width:1.5;filter:url(#shadow)}.h{font:700 17px Inter,system-ui,sans-serif;fill:#f1f5f9}
      .p{font:400 13px Inter,system-ui,sans-serif;fill:#a8bed0}.tiny{font:600 11px Inter,system-ui,sans-serif;fill:#5eead4;letter-spacing:1.4px}
      .arrow{stroke:#5eead4;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="24" fill="url(#bg)"/>
  <text x="70" y="68" class="title">Persistent Code Review Agent V2</text>
  <text x="70" y="98" class="sub">Durable execution · isolated evidence · human control · measurable trust</text>

  <rect x="50" y="135" width="1340" height="160" rx="20" class="lane"/>
  <text x="75" y="165" class="tiny">RELIABLE CONTROL PLANE</text>
  <rect x="75" y="185" width="190" height="82" rx="14" class="box"/>
  <text x="95" y="217" class="h">GitHub App</text><text x="95" y="242" class="p">Signed, idempotent webhooks</text>
  <rect x="340" y="185" width="210" height="82" rx="14" class="box2"/>
  <text x="360" y="217" class="h">PostgreSQL Queue</text><text x="360" y="242" class="p">Leases · retry · restart recovery</text>
  <rect x="625" y="185" width="190" height="82" rx="14" class="box"/>
  <text x="645" y="217" class="h">Review Worker</text><text x="645" y="242" class="p">Per-commit review versions</text>
  <rect x="890" y="185" width="205" height="82" rx="14" class="box"/>
  <text x="910" y="217" class="h">Human Checkpoint</text><text x="910" y="242" class="p">Approve · reject · dismiss</text>
  <rect x="1170" y="185" width="190" height="82" rx="14" class="box"/>
  <text x="1190" y="217" class="h">GitHub Review</text><text x="1190" y="242" class="p">Inline patches + check run</text>
  <path d="M265 226H335" class="arrow"/><path d="M550 226H620" class="arrow"/><path d="M815 226H885" class="arrow"/><path d="M1095 226H1165" class="arrow"/>

  <rect x="50" y="320" width="890" height="360" rx="20" class="lane"/>
  <text x="75" y="352" class="tiny">ISOLATED REVIEW INTELLIGENCE</text>
  <rect x="75" y="380" width="235" height="112" rx="14" class="box2"/>
  <text x="95" y="412" class="h">Detached PR Sandbox</text>
  <text x="95" y="438" class="p">Exact head SHA · no network</text><text x="95" y="460" class="p">Unique UID · resource limits</text>
  <rect x="365" y="380" width="235" height="112" rx="14" class="box"/>
  <text x="385" y="412" class="h">Repository Map</text>
  <text x="385" y="438" class="p">Python · TS/JS · Go</text><text x="385" y="460" class="p">Java · Rust callers/imports</text>
  <rect x="655" y="380" width="235" height="112" rx="14" class="box"/>
  <text x="675" y="412" class="h">Static + Execution</text>
  <text x="675" y="438" class="p">Ruff · Bandit · Semgrep</text><text x="675" y="460" class="p">Targeted tests and linters</text>
  <path d="M310 436H360" class="arrow"/><path d="M600 436H650" class="arrow"/>
  <rect x="165" y="545" width="285" height="104" rx="14" class="box"/>
  <text x="185" y="578" class="h">Specialist Reviewers</text>
  <text x="185" y="604" class="p">Logic · security · performance</text><text x="185" y="626" class="p">Contracts · tests · deterministic rules</text>
  <rect x="540" y="545" width="285" height="104" rx="14" class="box2"/>
  <text x="560" y="578" class="h">Evidence Verifier</text>
  <text x="560" y="604" class="p">Changed-line grounding</text><text x="560" y="626" class="p">Confidence · lifecycle · risk score</text>
  <path d="M450 597H535" class="arrow"/><path d="M772 492V540" class="arrow"/>

  <rect x="970" y="320" width="420" height="360" rx="20" class="lane"/>
  <text x="995" y="352" class="tiny">EVALUATION &amp; TRUST</text>
  <rect x="995" y="380" width="370" height="82" rx="14" class="box2"/>
  <text x="1015" y="411" class="h">120 Real-World PR Cases</text><text x="1015" y="438" class="p">Pinned provenance · seven categories</text>
  <rect x="995" y="485" width="370" height="82" rx="14" class="box"/>
  <text x="1015" y="516" class="h">Measured Quality</text><text x="1015" y="543" class="p">Precision · recall · FPR · calibration</text>
  <rect x="995" y="590" width="370" height="62" rx="14" class="box"/>
  <text x="1015" y="617" class="h">Regression Gate</text><text x="1015" y="639" class="p">Prompt · model · corpus fingerprints</text>
  <path d="M1180 462V480" class="arrow"/><path d="M1180 567V585" class="arrow"/>
</svg>
